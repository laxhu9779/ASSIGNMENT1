<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 1 - Product Showcase Card</title>
<style>
/* 1. Box Model Reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f8fafc;
  color: #0f172a;
  padding: 2rem 1rem;
  display: flex;
  justify-content: center;
}

/* 2. Mobile base: single-column stack */
.component-container { width: 100%; max-width: 900px; }

.product-card {
  display: grid;                 /* 1 column by default */
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
}

.product-media { position: relative; overflow: hidden; min-height: 240px; }

.product-img {
  width: 100%;
  height: 100%;
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  transition: transform 0.3s ease;
}
.product-media:hover .product-img { transform: scale(1.04); }

.badge {
  position: absolute;
  top: 1rem;
  left: 1rem;
  background: #f59e0b;
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.3rem 0.7rem;
  border-radius: 999px;
}

/* Flexbox: vertical distribution inside details */
.product-details {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 1.25rem;
  padding: 1.5rem;
}

/* Flexbox: category / rating row */
.meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: #64748b;
}
.rating { color: #f59e0b; font-weight: 700; }

h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
p { color: #475569; line-height: 1.5; margin-bottom: 1rem; }

.features { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.features li {
  background: #e0e7ff;
  color: #3730a3;
  font-size: 0.8rem;
  padding: 0.3rem 0.7rem;
  border-radius: 999px;
}

/* Flexbox: price / button shelf */
.shelf {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.price { font-size: 1.75rem; font-weight: 800; }
.price small { display: block; font-size: 0.75rem; font-weight: 400; color: #64748b; }

.btn {
  width: 100%;                   /* full width on mobile */
  padding: 0.85rem 1.5rem;
  border: none;
  border-radius: 10px;
  background: #4f46e5;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.btn:active { transform: scale(0.96); }

/* 3. Desktop breakpoint */
@media (min-width: 768px) {
  .product-card { grid-template-columns: 1fr 1fr; }
  .btn { width: auto; }
}
</style>
</head>
<body>
<main class="component-container">
  <article class="product-card">
    <div class="product-media">
      <div class="product-img" role="img" aria-label="Desk workspace mat">🖱️</div>
      <span class="badge">POPULAR</span>
    </div>
    <div class="product-details">
      <div class="meta-row">
        <span class="category">Category: Desk Accessories</span>
        <span class="rating">4.9 ★</span>
      </div>
      <div>
        <h1>Desk Workspace Mat</h1>
        <p>A large, smooth mat that keeps your keyboard, mouse and notes in one tidy place.</p>
        <ul class="features">
          <li>Water-resistant</li>
          <li>Non-slip base</li>
          <li>Stitched edges</li>
          <li>90 x 40 cm</li>
        </ul>
      </div>
      <div class="shelf">
        <div class="price">₹1,499<small>Tax included</small></div>
        <button class="btn" type="button">Add to Bag</button>
      </div>
    </div>
  </article>
</main>
</body>
</html>
