<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 4 - Creator Profile Header & Stats Card</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f8fafc;
  color: #0f172a;
  padding: 2rem 1rem;
  display: flex;
  justify-content: center;
}

.component-container { width: 100%; max-width: 900px; }

.profile-card {
  background: #fff;
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
}

/* Mobile: centered column */
.profile-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
  text-align: center;
}

.avatar {
  width: 120px;
  height: 120px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #f43f5e, #6366f1);
  transition: transform 0.25s ease;
}
.avatar:hover { transform: scale(1.05); }

.details {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  width: 100%;
}

.top-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
}
.username { font-size: 1.4rem; }

/* Follow + Message share equal width */
.actions { display: flex; gap: 0.5rem; width: 100%; }
.actions button {
  flex: 1;
  padding: 0.6rem 1rem;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}
.follow { background: #4f46e5; color: #fff; transition: transform 0.15s ease; }
.follow:active { transform: scale(0.96); }
.message { background: #e2e8f0; color: #0f172a; }

/* Stats: CSS Grid, 3 equal boxes */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  width: 100%;
}
.stat { background: #f1f5f9; border-radius: 10px; padding: 0.6rem; text-align: center; }
.stat strong { display: block; font-size: 1.15rem; }
.stat span { font-size: 0.8rem; color: #64748b; }

.bio p { color: #475569; line-height: 1.5; }
.bio a { color: #4f46e5; text-decoration: none; font-weight: 600; }

/* Story highlights: Flexbox horizontal scroll */
.highlights {
  display: flex;
  gap: 1rem;
  overflow-x: auto;
  margin-top: 1.5rem;
  padding-bottom: 0.5rem;
}
.highlight { flex-shrink: 0; text-align: center; font-size: 0.8rem; color: #475569; }
.highlight .circle {
  width: 64px;
  height: 64px;
  margin: 0 auto 0.4rem;
  border-radius: 50%;
  border: 3px solid #e2e8f0;
  background: linear-gradient(135deg, #38bdf8, #a78bfa);
}
.highlight.more .circle {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  font-size: 1.5rem;
}

/* Desktop breakpoint */
@media (min-width: 768px) {
  .profile-header {
    flex-direction: row;
    align-items: center;
    gap: 2rem;
    text-align: left;
  }
  .details { align-items: flex-start; }
  .top-row { flex-direction: row; align-items: center; gap: 1rem; }
  .actions { width: auto; }
  .actions button { flex: none; }
}
</style>
</head>
<body>
<main class="component-container">
  <section class="profile-card">
    <header class="profile-header">
      <div class="avatar" role="img" aria-label="Alex Rivera avatar">A</div>

      <div class="details">
        <div class="top-row">
          <h1 class="username">alex_designer</h1>
          <div class="actions">
            <button class="follow" type="button">Follow</button>
            <button class="message" type="button">Message</button>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><strong>148</strong><span>Posts</span></div>
          <div class="stat"><strong>12.4k</strong><span>Followers</span></div>
          <div class="stat"><strong>420</strong><span>Following</span></div>
        </div>

        <div class="bio">
          <p><strong>Alex Rivera</strong> • UI Engineer</p>
          <p>Building web design systems and open source widgets.</p>
          <a href="#">portfolio-alex.dev</a>
        </div>
      </div>
    </header>

    <div class="highlights">
      <div class="highlight"><div class="circle"></div>Design</div>
      <div class="highlight"><div class="circle"></div>Projects</div>
      <div class="highlight"><div class="circle"></div>Work</div>
      <div class="highlight"><div class="circle"></div>Tips</div>
      <div class="highlight more"><div class="circle">+</div>More</div>
    </div>
  </section>
</main>
</body>
</html>
